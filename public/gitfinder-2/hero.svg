<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">GitFinder 2 relationship workspace</title>
  <desc id="desc">A stylized local project and deployment relationship board.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#64748b" opacity=".38"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <rect x="64" y="56" width="1312" height="72" rx="18" fill="#172033" stroke="#334155"/>
  <circle cx="105" cy="92" r="12" fill="#8b5cf6"/>
  <text x="134" y="101" fill="#f8fafc" font-family="ui-sans-serif, system-ui" font-size="30" font-weight="700">GitFinder 2</text>
  <text x="1218" y="99" fill="#94a3b8" font-family="ui-sans-serif, system-ui" font-size="18">Relationship board</text>

  <path d="M287 443 C375 443 397 282 494 282" fill="none" stroke="#8b5cf6" stroke-width="4"/>
  <path d="M287 443 C389 443 416 535 494 535" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <path d="M834 282 C933 282 951 219 1040 219" fill="none" stroke="#8b5cf6" stroke-width="4"/>
  <path d="M834 282 C956 282 945 411 1040 411" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <path d="M834 535 C930 535 958 616 1040 616" fill="none" stroke="#38bdf8" stroke-width="4"/>

  <g filter="url(#shadow)">
    <rect x="92" y="349" width="195" height="188" rx="28" fill="#172033" stroke="#475569" stroke-width="2"/>
    <rect x="116" y="375" width="54" height="54" rx="16" fill="url(#accent)"/>
    <path d="M132 412h22m-11-11v22" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="116" y="468" fill="#94a3b8" font-family="ui-sans-serif, system-ui" font-size="17">Local host</text>
    <text x="116" y="500" fill="#f8fafc" font-family="ui-sans-serif, system-ui" font-size="28" font-weight="700">con01</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="494" y="184" width="340" height="196" rx="30" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="3"/>
    <text x="528" y="229" fill="#c4b5fd" font-family="ui-sans-serif, system-ui" font-size="17">PROJECT</text>
    <text x="528" y="268" fill="#fff" font-family="ui-sans-serif, system-ui" font-size="29" font-weight="700">Online tools</text>
    <rect x="528" y="302" width="128" height="44" rx="12" fill="#272252" stroke="#6d5bd0"/>
    <text x="549" y="330" fill="#ddd6fe" font-family="ui-sans-serif, system-ui" font-size="16">2 deployments</text>
    <rect x="670" y="302" width="128" height="44" rx="12" fill="#272252" stroke="#6d5bd0"/>
    <text x="696" y="330" fill="#ddd6fe" font-family="ui-sans-serif, system-ui" font-size="16">1 access point</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="494" y="437" width="340" height="196" rx="30" fill="#082f49" stroke="#38bdf8" stroke-width="3"/>
    <text x="528" y="482" fill="#7dd3fc" font-family="ui-sans-serif, system-ui" font-size="17">PROJECT</text>
    <text x="528" y="521" fill="#fff" font-family="ui-sans-serif, system-ui" font-size="29" font-weight="700">Data services</text>
    <rect x="528" y="555" width="128" height="44" rx="12" fill="#0c3e5c" stroke="#2584aa"/>
    <text x="549" y="583" fill="#bae6fd" font-family="ui-sans-serif, system-ui" font-size="16">3 repositories</text>
    <rect x="670" y="555" width="128" height="44" rx="12" fill="#0c3e5c" stroke="#2584aa"/>
    <text x="694" y="583" fill="#bae6fd" font-family="ui-sans-serif, system-ui" font-size="16">Healthy</text>
  </g>

  <g filter="url(#shadow)" font-family="ui-sans-serif, system-ui">
    <rect x="1040" y="153" width="300" height="132" rx="24" fill="#172033" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="1080" cy="195" r="16" fill="#8b5cf6"/>
    <text x="1110" y="201" fill="#fff" font-size="20" font-weight="700">dashboard</text>
    <text x="1080" y="243" fill="#94a3b8" font-size="16">deployment · running</text>

    <rect x="1040" y="345" width="300" height="132" rx="24" fill="#172033" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="1080" cy="387" r="16" fill="#38bdf8"/>
    <text x="1110" y="393" fill="#fff" font-size="20" font-weight="700">app.oaktechz.com</text>
    <text x="1080" y="435" fill="#94a3b8" font-size="16">access point · online</text>

    <rect x="1040" y="550" width="300" height="132" rx="24" fill="#172033" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="1080" cy="592" r="16" fill="#38bdf8"/>
    <text x="1110" y="598" fill="#fff" font-size="20" font-weight="700">api-service</text>
    <text x="1080" y="640" fill="#94a3b8" font-size="16">repository · synced</text>
  </g>

  <rect x="92" y="746" width="1248" height="86" rx="22" fill="#111827" stroke="#334155"/>
  <text x="126" y="799" fill="#94a3b8" font-family="ui-sans-serif, system-ui" font-size="18">Local projects</text>
  <text x="303" y="799" fill="#64748b" font-family="ui-sans-serif, system-ui" font-size="18">•</text>
  <text x="329" y="799" fill="#94a3b8" font-family="ui-sans-serif, system-ui" font-size="18">Git repositories</text>
  <text x="527" y="799" fill="#64748b" font-family="ui-sans-serif, system-ui" font-size="18">•</text>
  <text x="553" y="799" fill="#94a3b8" font-family="ui-sans-serif, system-ui" font-size="18">Deployment relationships</text>
